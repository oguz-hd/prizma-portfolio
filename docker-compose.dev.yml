# Geliştirme: Vite dev sunucusu, HMR açık.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   → http://localhost:5174          site
#   → http://localhost:5175/admin/   yönetim paneli
#   → http://localhost:8001/docs     API

services:
  web:
    # ⚠️ Ayrı imaj adı ŞART. Dev ve prod aynı adı kullanırsa en son build edilen
    # diğerini ezer ve `up` yanlış aşamayı çalıştırır (dev beklerken Caddy açılır).
    image: prizma-portfolio-web:dev
    build:
      target: dev
    ports:
      - '5174:5174'
    environment:
      # Windows'ta bind mount üzerinden dosya değişikliği bildirimleri (inotify)
      # konteynere ulaşmıyor; yoklama olmadan HMR gelmez.
      # vite.config.ts bu değişkeni okuyor — yerel `npm run dev`de boşuna CPU yakmasın diye.
      VITE_USE_POLLING: '1'
      # İçerik (/content.json) ve meta etiketleri API'den (vite.config.ts).
      API_ORIGIN: http://api:8000
    depends_on:
      - api
    volumes:
      # Kaynak kod host'tan bağlanıyor → kaydet, konteyner görsün.
      - ./web:/app
      # ⚠️ ANONİM VOLUME — bu satır kritik.
      # Üstteki bind mount host'un `web/node_modules`ünü konteynerin üstüne serer.
      # Host'taki paketler Windows için kurulu (win32 native binary'ler); Linux
      # konteynerde çalışmazlar. Bu satır konteynerin kendi node_modules'ünü korur.
      - /app/node_modules
    # Geliştirmede konteyner çökerse haberimiz olsun, sessizce yeniden başlamasın.
    restart: 'no'

  # Yönetim paneli (Faz 7b). Yalnızca geliştirmede ayrı servis: yayında web
  # imajı paneli de derleyip /admin/ altında sunuyor (web/Dockerfile → admin-build).
  admin:
    image: prizma-portfolio-admin:dev
    build:
      context: ./admin
      target: dev
    ports:
      - '5175:5175'
    environment:
      VITE_USE_POLLING: '1'
      # /api ve sitenin fontları (/fonts) yönlendiriliyor (admin/vite.config.ts).
      API_ORIGIN: http://api:8000
      WEB_ORIGIN: http://web:5174
      # "Siteyi aç" — tarayıcıdan açıldığı için konteyner adı değil, host portu.
      VITE_SITE_URL: http://localhost:5174/
    depends_on:
      - api
      - web
    volumes:
      - ./admin:/app
      # web ile aynı sebep: host'un node_modules'ü konteynerinkini gölgelemesin.
      - /app/node_modules
      # ★ Panel sözleşmeyi ve paletleri sitenin kaynağından import ediyor (@site).
      - ./web/src:/web/src:ro
    restart: 'no'

  api:
    image: prizma-portfolio-api:dev
    build:
      target: dev
    ports:
      - '8001:8000'
    environment:
      DEBUG: '1'
    volumes:
      # Kaynak host'tan bağlı → kaydet, fastapi dev yeniden yüklesin.
      - ./api/app:/app/app
      - data:/data
    restart: 'no'
