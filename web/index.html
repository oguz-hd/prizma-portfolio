<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Sayfa boyanmadan önceki zemin rengi.
      Beyaz bir flaş görünürse ilk izlenim bozulur; koyu tema baştan devrede olmalı.
      Değer presets.ts'teki tayf.ground ile aynı — tek eşleşme noktası, bilerek.
    -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#070A12" />
    <style>
      html { background: #070A12; }
    </style>

    <!--
      Sitenin TEK fontu (Oturum 2, kullanıcı isteği): önden çek. `font-display:
      swap` tek başına yetmez — preload olmadan ilk kareler sistem fontuyla
      boyanır, sonra değişir; girişteki yay ölçüsü de bir kez kayar.
    -->
    <link
      rel="preload"
      href="/fonts/DepartureMono-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      Simge: build'de Tayf paletiyle yazılan dosya (vite.config.ts → staticFavicon) —
      arama motoru ve JS çalıştırmayanlar bunu görür. main.tsx sonra seçili palete
      göre değiştiriyor (theme/favicon.ts). Geliştirmede aynı SVG'yi Vite sunuyor.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Sitenin içeriği (Faz 6: veritabanı → /content.json). main.tsx mount'tan önce
      bunu bekliyor; önden çekilince JS inerken içerik de iner. `crossorigin`
      fetch()'in varsayılanıyla eşleşsin diye — eşleşmezse iki kez indirilir.
    -->
    <link rel="preload" href="/content.json" as="fetch" crossorigin />

    <!--
      <title>, description, og:title, og:description içerikten: sunucu buraya
      gömüyor (vite.config.ts → metaFromContent). İçerikten bağımsız olanlar sabit.
    -->
    <!--site-meta-->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="tr_TR" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
