[project]
name = "prizma-portfolio-api"
version = "0.1.0"
description = "prizma-portfolio içerik ve yönetim API'si"
requires-python = ">=3.12"

dependencies = [
    "fastapi[standard]>=0.120",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6",
    # JWT + parola hash'leme. pwdlib passlib'in güncel halefi; argon2 varsayılan
    # algoritma (docs/ARCHITECTURE.md § 2: argon2/bcrypt ile hash'lenir).
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2.1",
    # Görsel yükleme (Faz 9, app/media.py): WebP'ye çevirme, EXIF/GPS silme.
    # Çok parçalı form (UploadFile) fastapi[standard] ile geliyor.
    "pillow>=11",
]

[dependency-groups]
# Testler ve lint: docker exec prizma-portfolio-api-1 pytest
#                 docker exec prizma-portfolio-api-1 ruff check
dev = ["pytest>=8", "ruff>=0.14"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Varsayılan (E, F) + import sırası, modern sözdizimi, olası hatalar, sadeleştirme.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# İçerik metinleri ve test verisi: satırı bölmek okumayı bozuyor.
"app/seed.py" = ["E501"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
