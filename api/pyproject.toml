[project]
name = "prizma-portfolio-api"
version = "0.1.0"
description = "prizma-portfolio içerik ve yönetim API'si"
requires-python = ">=3.12"

dependencies = [
    "fastapi[standard]>=0.120",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6",
    # JWT + parola hash'leme. pwdlib passlib'in güncel halefi; argon2 varsayılan
    # algoritma (docs/ARCHITECTURE.md § 2: argon2/bcrypt ile hash'lenir).
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2.1",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
